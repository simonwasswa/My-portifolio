# Netlify build settings — picked up automatically when the site is deployed.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs a recent Node.js
  NODE_VERSION = "22"

# Cache images and hashed JS/CSS for a long time (file names change when content changes)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
